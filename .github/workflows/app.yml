name: application quality
on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Record all dependency advisories
        run: pnpm audit --json --audit-level critical > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: app/dependency-audit.json
          retention-days: 7
      - run: pnpm check
      - run: pnpm build
      # Stage C is only worth shipping if a crawler that never runs JS reads it.
      - run: pnpm exec tsx scripts/check-landing-ssr.ts
  settlement:
    name: shared budget settlement against a real Redis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-tools
      # The offline suite proves which commands we send; this proves the reserve and
      # settle Lua behave as claimed on a real Redis. It never runs --live: no model
      # credential belongs in CI, so the gateway's own usage report is verified by an
      # operator running the same script locally.
      - run: pnpm exec tsx scripts/check-budget-settlement-redis.ts
