[package]
name = "socialcoach-desktop"
version = "0.1.0"
description = "SocialCoach desktop shell (Tauri) — loads a local Next.js standalone server"
authors = ["SocialCoach"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "socialcoach_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Auto-update support, off by default: placeholder endpoints in the updater
# config crash local builds, and SocialCoach has no update channel yet.
# Enable via `--features updater` together with real keys in tauri.conf.json.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
